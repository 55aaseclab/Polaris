services:
  morpheus:
    image: ttl.sh/morpheus-prebuilt-1781875178:24h
    container_name: morpheus-docker
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        set -eux
        mkdir -p /root /root/.codex /root/.claude /root/.paseo /root/.ssh
        chmod 755 /root /root/.codex /root/.claude
        chmod 700 /root/.paseo /root/.ssh

        profile_fix_needed=0
        [ -f /root/.profile ] || profile_fix_needed=1
        for rc in /root/.profile /root/.bashrc /root/.zshrc; do
          [ -f "$$rc" ] || continue
          grep -Eq '/root/root/\.cargo/env|\$$HOME/root/\.cargo/env|^\. "\$$HOME/\.cargo/env"$$|^source "\$$HOME/\.cargo/env"$$' "$$rc" && profile_fix_needed=1 && break
        done
        if [ "$$profile_fix_needed" = 1 ]; then
          touch /root/.profile
          for rc in /root/.profile /root/.bashrc /root/.zshrc; do
            [ -f "$$rc" ] || continue
            awk 'BEGIN{seen=0}
              {
                if ($0 ~ /\/root\/root\/\.cargo\/env/ || $0 ~ /\$$HOME\/root\/\.cargo\/env/) { if (!seen) print "[ -f \"\$$HOME/.cargo/env\" ] && . \"\$$HOME/.cargo/env\""; seen=1; next }
                if ($0 == ". \"\$$HOME/.cargo/env\"" || $0 == "source \"\$$HOME/.cargo/env\"" || $0 == "[ -f \"\$$HOME/.cargo/env\" ] && . \"\$$HOME/.cargo/env\"") { if (!seen) print "[ -f \"\$$HOME/.cargo/env\" ] && . \"\$$HOME/.cargo/env\""; seen=1; next }
                print
              }
              END{ if (ARGV[1] ~ /\.profile$$/ && !seen) print "[ -f \"\$$HOME/.cargo/env\" ] && . \"\$$HOME/.cargo/env\"" }' "$$rc" > "$$rc.tmp"
            mv "$$rc.tmp" "$$rc"
          done
        fi

        if [ ! -L /usr/local/bin/pnpm ] || [ "$$(readlink /usr/local/bin/pnpm 2>/dev/null)" != "/opt/agent-cli/bin/pnpm" ]; then
          ln -sf /opt/agent-cli/bin/pnpm /usr/local/bin/pnpm
        fi

        git config --global core.editor vi
        git config --global pull.rebase true
        git config --global user.name 'Qiang Liu'
        git config --global user.email cyruscyliu@gmail.com

        if [ -f /bootstrap-secrets/codex/auth.json ]; then
          install -m 600 /bootstrap-secrets/codex/auth.json /root/.codex/auth.json
        fi
        if [ -f /bootstrap-secrets/codex/config.toml ]; then
          install -m 600 /bootstrap-secrets/codex/config.toml /root/.codex/config.toml
        fi
        if [ -f /bootstrap-secrets/claude/settings.json ]; then
          install -m 600 /bootstrap-secrets/claude/settings.json /root/.claude/settings.json
        fi

        if [ ! -f /root/.ssh/id_ed25519 ]; then
          ssh-keygen -q -t ed25519 -C morpheus@agent-vault -N '' -f /root/.ssh/id_ed25519
        fi
        chmod 400 /root/.ssh/id_ed25519 || true
        chmod 644 /root/.ssh/id_ed25519.pub || true
        [ ! -e /root/.ssh/authorized_keys ] || chmod 600 /root/.ssh/authorized_keys || true
        [ ! -e /root/.ssh/known_hosts ] || chmod 600 /root/.ssh/known_hosts || true
        [ ! -e /root/.ssh/known_hosts.old ] || chmod 600 /root/.ssh/known_hosts.old || true

        rm -f /root/.paseo/paseo.pid
        PASEO_HOME=/root/.paseo paseo daemon start --listen 0.0.0.0:6767
        paired=0
        for i in $(seq 1 30); do
          PASEO_HOME=/root/.paseo paseo daemon pair --json > /root/.paseo/pairing.json.tmp 2>/dev/null && mv /root/.paseo/pairing.json.tmp /root/.paseo/pairing.json && paired=1 && break
          sleep 2
        done
        test "$$paired" = 1
        touch /tmp/.ready
        sleep infinity
    ports:
      - "31677:6767"
      - "31678:8080"
      - "31679:8081"
    volumes:
      - /var/lib/kubelet/plugins/kubernetes.io/csi/driver.longhorn.io/083db50c9d2e0df8f14538d0b1861805375f1344a8ce178164e56a34af938d14/globalmount:/root
      - ${MORPHEUS_SECRETS_DIR:-./secrets/polaris}:/bootstrap-secrets:ro
