services:
  demo:
    image: ttl.sh/polaris-demo-debian13-1782126452:24h
    container_name: demo-docker
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        set -eux
        mkdir -p /root
        chmod 755 /root
        mkdir -p /workspace/project /workspace/state/paseo /workspace/state/paseo/evolution /identity/codex /identity/claude /ssh /run/workspace/tmp /run/workspace/pids /run/workspace/sockets
        rm -f /root/.codex /root/.claude /root/.paseo /root/.ssh /root/workspace
        ln -sfn /identity/codex /root/.codex
        ln -sfn /identity/claude /root/.claude
        ln -sfn /workspace/state/paseo /root/.paseo
        ln -sfn /ssh /root/.ssh
        ln -sfn /workspace/project /root/workspace
        ln -sfn /workspace/project /root/Morpheus
        if [ ! -f /identity/codex/auth.json ]; then python3 -c "import base64, pathlib; path = pathlib.Path(\"/identity/codex/auth.json\"); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(base64.b64decode(\"ewogICJwcm92aWRlciI6ICJkZW1vIiwKICAibm90ZSI6ICJzeW50aGV0aWMgZml4dHVyZSBmb3IgUG9sYXJpcyBkZW1vIHdvcmtzcGFjZXMiCn0K\"));"; fi
        chmod 600 /identity/codex/auth.json
        if [ ! -f /identity/codex/config.toml ]; then python3 -c "import base64, pathlib; path = pathlib.Path(\"/identity/codex/config.toml\"); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(base64.b64decode(\"bW9kZWwgPSAiZ3B0LTUiCgpbcHJvZmlsZXMuZGVtb10KYXBwcm92YWxfcG9saWN5ID0gIm5ldmVyIgo=\"));"; fi
        chmod 600 /identity/codex/config.toml
        if [ ! -f /identity/claude/settings.json ]; then python3 -c "import base64, pathlib; path = pathlib.Path(\"/identity/claude/settings.json\"); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(base64.b64decode(\"ewogICJ0aGVtZSI6ICJkZW1vIiwKICAibm90ZSI6ICJzeW50aGV0aWMgZml4dHVyZSBmb3IgUG9sYXJpcyBkZW1vIHdvcmtzcGFjZXMiCn0K\"));"; fi
        chmod 600 /identity/claude/settings.json
        if [ ! -f /ssh/id_ed25519 ]; then ssh-keygen -q -t ed25519 -C demo@example.com -N '' -f /ssh/id_ed25519; fi
        chmod 400 /ssh/id_ed25519 || true
        chmod 644 /ssh/id_ed25519.pub || true
        rm -f /root/.paseo/paseo.pid /run/workspace/pids/paseo.pid
        PASEO_HOME=/root/.paseo paseo daemon start --listen 0.0.0.0:6767
        paired=0; for i in $(seq 1 30); do PASEO_HOME=/root/.paseo paseo daemon pair --json > /root/.paseo/pairing.json.tmp 2>/dev/null && mv /root/.paseo/pairing.json.tmp /root/.paseo/pairing.json && paired=1 && break; sleep 2; done; test "$$paired" = 1
        python3 -c "import base64, pathlib; path = pathlib.Path(\"/root/.paseo/evolution/runtime-observer.mjs\"); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(base64.b64decode(\"\"));"
        chmod 755 /root/.paseo/evolution/runtime-observer.mjs
        POLARIS_PROJECT="demo" POLARIS_USER_PROFILE_ID="100000000000000001" POLARIS_MANAGER_ID="paseo" POLARIS_TOOL_ROOT="/root/.local/polaris" POLARIS_PASEO_DAEMON_URL="ws://127.0.0.1:6767/ws" PASEO_HOME=/root/.paseo node /root/.paseo/evolution/runtime-observer.mjs > /root/.paseo/evolution/runtime-observer.log 2>&1 &
        touch /tmp/.ready
        sleep infinity
    ports:
      - "32677:6767"
    environment:
      POLARIS_EVOLUTION_ROOT: /root/.paseo/evolution
      POLARIS_EVOLUTION_CONTEXT_FILE: 
    volumes:
      - type: volume
        source: demo-project
        target: /workspace/project
      - type: volume
        source: demo-project-state
        target: /workspace/state
      - type: volume
        source: polaris-100000000000000001-identity
        target: /identity
      - type: volume
        source: polaris-100000000000000001-ssh
        target: /ssh
    tmpfs:
      - /run/workspace

volumes:
  demo-project:
    name: demo-project
  demo-project-state:
    name: demo-project-state
  polaris-100000000000000001-identity:
    name: polaris-100000000000000001-identity
  polaris-100000000000000001-ssh:
    name: polaris-100000000000000001-ssh
