project: demo
user_profile: '100000000000000001'
backend:
  kind: pod
  spec_files: null
credentials:
  bindings:
    - purpose: agent-auth
      credentialId: demo-codex
      required: true
runtime:
  class: gvisor
  base_image: ttl.sh/polaris-demo-debian13-1782126452:24h
  user: root
  storage_claim_name: null
  privileged: null
  docker_enabled: true
resources:
  cpu: '8'
  memory: 16Gi
  ephemeral_storage: 120Gi
  cpu_request: '2'
  memory_request: 4Gi
  ephemeral_storage_request: 20Gi
  unbounded: true
agent:
  kind: multi
  label: Codex + Claude Code
  args: []
  persist_state: true
tooling:
  bootstrap_profile: prebuilt
  install_rustup: false
  git_core_editor: vi
env:
  plain: {}
service:
  enabled: true
  mode: nodeport
  ports:
    - container_port: '6767'
      node_port: '32677'
      name: paseo
  host: null
  path: /
attachments:
  workspace-data:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/project
    durable_paths:
      - /workspace/project
    source:
      kind: netfs
      server: netfs.local
      export_path: /exports/polaris/workspaces
      sub_path: demo
      mount_options:
        - nfsvers=4.1
        - hard
        - rw
      volume_ref: demo-workspace-data
      volume_size: 120Gi
      description: shared workspace data for demo
  workspace-runtime-state:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/state
    durable_paths:
      - /workspace/state/paseo
      - /workspace/state/paseo/evolution
    source:
      kind: persistent-volume
      volume_ref: demo-workspace-runtime-state
      volume_size: 20Gi
      description: reusable workspace runtime state for demo
  user-identity-state:
    scope: user
    sharing: cross-workspace
    mount_root: /identity
    durable_paths:
      - /identity/codex
      - /identity/claude
      - /identity/codex-xdg/config
      - /identity/codex-xdg/data
      - /identity/codex-xdg/state
    source:
      kind: secret-material
      description: user identity material sourced from spec auth files
  user-ssh-state:
    scope: user
    sharing: cross-workspace
    mount_root: /ssh
    durable_paths:
      - /ssh
    source:
      kind: generated-material
      description: user SSH material
  ephemeral-runtime:
    mount_root: /run/workspace
    paths:
      - /run/workspace/tmp
      - /run/workspace/pids
      - /run/workspace/sockets
    stale_artifacts:
      - /root/.paseo/paseo.pid
      - /run/workspace/pids/paseo.pid
