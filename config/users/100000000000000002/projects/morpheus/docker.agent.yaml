project: morpheus
user_profile: '100000000000000002'
backend:
  kind: docker
  spec_files: null
credentials:
  bindings:
    - purpose: agent-auth
      credentialId: codex-default
      required: true
    - purpose: git-auth
      credentialId: github-ssh
      required: true
runtime:
  class: docker
  base_image: ttl.sh/user-002-morpheus:24h
  user: root
  storage_claim_name: null
  privileged: null
  docker_enabled: true
resources:
  cpu: '8'
  memory: 16Gi
  ephemeral_storage: 120Gi
  cpu_request: '2'
  memory_request: 4Gi
  ephemeral_storage_request: 20Gi
  unbounded: true
agent:
  kind: multi
  label: Codex + Claude Code
  args: []
  persist_state: true
tooling:
  bootstrap_profile: prebuilt
  install_rustup: false
  git_core_editor: vi
env:
  plain: {}
service:
  enabled: true
  mode: nodeport
  ports:
    - container_port: '6767'
      node_port: '32678'
      name: paseo
  host: null
  path: /
attachments:
  workspace-data:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/project
    durable_paths:
      - /workspace/project
    source:
      kind: persistent-volume
      volume_ref: morpheus-project
      description: reusable docker workspace data for morpheus
  workspace-runtime-state:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/state
    durable_paths:
      - /workspace/state/paseo
      - /workspace/state/paseo/evolution
    source:
      kind: persistent-volume
      volume_ref: morpheus-project
      sub_path: state
      description: reusable docker workspace runtime state for morpheus
  user-identity-state:
    scope: user
    sharing: cross-workspace
    mount_root: /identity
    durable_paths:
      - /identity/codex
      - /identity/claude
    source:
      kind: secret-material
      description: user identity material sourced from credential files
  user-ssh-state:
    scope: user
    sharing: cross-workspace
    mount_root: /ssh
    durable_paths:
      - /ssh
    source:
      kind: generated-material
      description: reusable user SSH material for morpheus
  ephemeral-runtime:
    mount_root: /run/workspace
    paths:
      - /run/workspace/tmp
      - /run/workspace/pids
      - /run/workspace/sockets
    stale_artifacts:
      - /root/.paseo/paseo.pid
      - /run/workspace/pids/paseo.pid
profile: morpheus
