apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: morpheus-vm
  namespace: morpheus
  labels:
    app: morpheus
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: morpheus
    spec:
      nodeSelector:
        kubernetes.io/hostname: debian
      terminationGracePeriodSeconds: 30
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 20Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          - name: runtimedisk
            disk:
              bus: virtio
          - name: paseodisk
            disk:
              bus: virtio
            serial: paseo-state
          filesystems:
          - name: projectfs
            virtiofs: {}
          interfaces:
          - name: default
            masquerade: {}
          rng: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:latest
      - name: cloudinitdisk
        cloudInitNoCloud:
          secretRef:
            name: morpheus-vm-cloudinit
      - name: projectfs
        persistentVolumeClaim:
          claimName: morpheus-project
      - name: runtimedisk
        emptyDisk:
          capacity: 100Gi
      - name: paseodisk
        persistentVolumeClaim:
          claimName: morpheus-paseo
