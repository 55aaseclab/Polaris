apiVersion: v1
kind: Namespace
metadata:
  name: __PROJECT__
---
__PERSISTENT_VOLUME_CLAIMS__---
apiVersion: v1
kind: Service
metadata:
  name: __PROJECT__
  namespace: __PROJECT__
spec:
  type: NodePort
  selector:
    vm.kubevirt.io/name: __PROJECT__-vm
  ports:
    - name: paseo
      port: __SERVICE_PORT__
      targetPort: __SERVICE_PORT__
      nodePort: __NODE_PORT__
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __PROJECT__-vm
  namespace: __PROJECT__
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: __PROJECT__-vm
    spec:
      domain:
        resources:
          requests:
            memory: __MEMORY_REQUEST__
        memory:
          guest: __MEMORY_GUEST__
        devices:
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - port: __SERVICE_PORT__
                  protocol: TCP
          filesystems:
            - name: workspace-data
              virtiofs: {}
            - name: workspace-runtime-state
              virtiofs: {}
            - name: user-identity-state
              virtiofs: {}
            - name: user-ssh-state
              virtiofs: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
      volumes:
        - name: rootdisk
          containerDisk:
            image: __ROOTDISK_IMAGE__
        - name: workspace-data
          persistentVolumeClaim:
            claimName: __WORKSPACE_DATA_VOLUME__
        - name: workspace-runtime-state
          persistentVolumeClaim:
            claimName: __WORKSPACE_RUNTIME_STATE_VOLUME__
        - name: user-identity-state
          persistentVolumeClaim:
            claimName: __USER_IDENTITY_STATE_VOLUME__
        - name: user-ssh-state
          persistentVolumeClaim:
            claimName: __USER_SSH_STATE_VOLUME__
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: __PROJECT__-vm-cloudinit
      networks:
        - name: default
          pod: {}
