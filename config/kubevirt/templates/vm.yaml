apiVersion: v1
kind: Namespace
metadata:
  name: __PROJECT__
---
apiVersion: v1
kind: Service
metadata:
  name: __PROJECT__
  namespace: __PROJECT__
spec:
  type: NodePort
  selector:
    vm.kubevirt.io/name: __PROJECT__-vm
  ports:
    - name: paseo
      port: __SERVICE_PORT__
      targetPort: __SERVICE_PORT__
      nodePort: __NODE_PORT__
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __PROJECT__-vm
  namespace: __PROJECT__
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: __PROJECT__-vm
    spec:
      domain:
        devices:
          disks:
            - name: workspace
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: __WORKSPACE_VOLUME__
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: __PROJECT__-vm-cloudinit
