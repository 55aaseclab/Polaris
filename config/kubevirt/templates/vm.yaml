apiVersion: v1
kind: Namespace
metadata:
  name: __PROJECT__
---
__PERSISTENT_VOLUME_CLAIMS__---
apiVersion: v1
kind: Service
metadata:
  name: __PROJECT__
  namespace: __PROJECT__
spec:
  type: NodePort
  selector:
    vm.kubevirt.io/name: __PROJECT__-vm
  ports:
__SERVICE_PORTS__
---
__PRIVATE_WANGHAI_SERVICE__
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __PROJECT__-vm
  namespace: __PROJECT__
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: __PROJECT__-vm
    spec:
      domain:
        resources:
          requests:
            memory: __MEMORY_REQUEST__
        memory:
          guest: __MEMORY_GUEST__
        devices:
          interfaces:
            - name: default
              masquerade: {}
              ports:
__INTERFACE_PORTS__
          filesystems:
            - name: vault-data
              virtiofs: {}
            - name: vault-runtime-state
              virtiofs: {}
            - name: user-identity-state
              virtiofs: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
      volumes:
        - name: rootdisk
          containerDisk:
            image: __ROOTDISK_IMAGE__
        - name: vault-data
          persistentVolumeClaim:
            claimName: __VAULT_DATA_VOLUME__
        - name: vault-runtime-state
          persistentVolumeClaim:
            claimName: __VAULT_RUNTIME_STATE_VOLUME__
        - name: user-identity-state
          persistentVolumeClaim:
            claimName: __USER_IDENTITY_STATE_VOLUME__
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: __PROJECT__-vm-cloudinit
      networks:
        - name: default
          pod: {}
