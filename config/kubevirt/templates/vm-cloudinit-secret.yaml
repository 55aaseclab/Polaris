apiVersion: v1
kind: Secret
metadata:
  name: __PROJECT__-vm-cloudinit
  namespace: __PROJECT__
stringData:
  userdata: |
    #cloud-config
    bootcmd:
      - mkdir -p /workspace/.cache /workspace/.codex /workspace/.claude /workspace/.paseo /workspace/.ssh /workspace/.cargo /workspace/.rustup /workspace/.npm /workspace/.local/polaris /workspace/.tmp
      - /bin/sh -lc 'for p in .cache .codex .claude .paseo .ssh .cargo .rustup .npm .tmp; do rm -rf "/root/$p"; ln -s "/workspace/$p" "/root/$p"; done'
      - chmod 700 /workspace/.ssh
      - chmod 1777 /workspace/.tmp
      - rm -f /workspace/.paseo/paseo.pid
      - |
        cat >/workspace/.codex/auth.json <<'EOF'
        __CODEX_AUTH_JSON__
        EOF
      - |
        cat >/workspace/.codex/config.toml <<'EOF'
        __CODEX_CONFIG_TOML__
        EOF
      - |
        cat >/workspace/.claude/settings.json <<'EOF'
        __CLAUDE_SETTINGS_JSON__
        EOF
      - ssh-keygen -q -t ed25519 -C fixture@polaris -N "" -f /ssh/id_ed25519
      - PASEO_HOME=/root/.paseo paseo daemon start --listen 0.0.0.0:6767
      - /bin/sh -lc 'paired=0; for i in $(seq 1 30); do PASEO_HOME=/root/.paseo paseo daemon pair --json > /root/.paseo/pairing.json.tmp 2>/dev/null && mv /root/.paseo/pairing.json.tmp /root/.paseo/pairing.json && paired=1 && break; sleep 2; done; test "$paired" = 1'
