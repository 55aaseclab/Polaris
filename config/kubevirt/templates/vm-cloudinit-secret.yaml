apiVersion: v1
kind: Secret
metadata:
  name: __PROJECT__-vm-cloudinit
  namespace: __PROJECT__
stringData:
  userdata: |
    #cloud-config
    ssh_pwauth: true
    disable_root: false
    chpasswd:
      expire: false
      users:
        - name: root
          password: __PROBE_PASSWORD__
          type: text
    write_files:
      - path: /usr/local/bin/polaris-sync-shared-state
        permissions: '0755'
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          mode="${1:-}"
          shared_root=/mnt/polaris-shared
          rsync_bin="$(command -v rsync)"
          resolve_mount_gid() {
            local path="$1"
            if [ -e "$path" ]; then
              stat -c '%g' "$path"
              return
            fi
            stat -c '%g' "$(dirname "$path")"
          }
          run_with_mount_gid() {
            local mount_path="$1"
            shift
            local gid
            gid="$(resolve_mount_gid "$mount_path" 2>/dev/null || true)"
            if [ -n "$gid" ] && command -v setpriv >/dev/null 2>&1; then
              setpriv --reuid 0 --regid "$gid" --clear-groups "$@"
              return
            fi
            "$@"
          }
          run_rsync_with_mount_gid() {
            local mount_path="$1"
            shift
            set +e
            run_with_mount_gid "$mount_path" "$@"
            local status=$?
            set -e
            if [ "$status" -eq 24 ]; then
              return 0
            fi
            return "$status"
          }
          sync_dir() {
            local src="$1"
            local dest="$2"
            local mount_path="$3"
            mkdir -p "$src" "$dest"
            run_rsync_with_mount_gid "$mount_path" \
              "$rsync_bin" -rl --delete --no-owner --no-group --no-perms --omit-dir-times --no-times \
              "$src/" "$dest/"
          }
          sync_paseo_dir() {
            local src="$1"
            local dest="$2"
            local mount_path="$3"
            mkdir -p "$src" "$dest"
            run_rsync_with_mount_gid "$mount_path" \
              "$rsync_bin" -rl --delete --no-owner --no-group --no-perms --omit-dir-times --no-times \
              --exclude 'models/' \
              --exclude 'models/**' \
              "$src/" "$dest/"
          }
          case "$mode" in
            sync-in)
              mkdir -p /workspace/state/paseo /workspace/state/paseo/evolution "$shared_root/workspace-runtime-state/paseo"
              sync_paseo_dir "$shared_root/workspace-runtime-state/paseo" /workspace/state/paseo "$shared_root/workspace-runtime-state/paseo"
              sync_dir "$shared_root/user-identity-state" /identity "$shared_root/user-identity-state"
              ;;
            sync-out)
              mkdir -p "$shared_root/workspace-runtime-state/paseo"
              sync_paseo_dir /workspace/state/paseo "$shared_root/workspace-runtime-state/paseo" "$shared_root/workspace-runtime-state/paseo"
              sync_dir /identity "$shared_root/user-identity-state" "$shared_root/user-identity-state"
              ;;
            *)
              echo "usage: polaris-sync-shared-state <sync-in|sync-out>" >&2
              exit 2
              ;;
          esac
      - path: /usr/local/bin/polaris-ensure-paseo-daemon
        permissions: '0755'
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          home=/root
          pid_file="$home/.paseo/paseo.pid"
          daemon_log="$home/.paseo/daemon.log"
          paseo_ready() {
            printf '%s' "$1" | grep -Eq '"localDaemon"[[:space:]]*:[[:space:]]*"running"' &&
              printf '%s' "$1" | grep -Eq '"connectedDaemon"[[:space:]]*:[[:space:]]*"reachable"'
          }
          paseo_wait_ready() {
            local paseo_status
            for _ in $(seq 1 15); do
              paseo_status="$(timeout 5s env PASEO_HOME="$home/.paseo" paseo daemon status --json 2>/dev/null || true)"
              if paseo_ready "$paseo_status"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          paseo_stop_runner() {
            local paseo_pid paseo_args
            paseo_pid="$(sed -n 's/.*"pid"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$pid_file" 2>/dev/null | head -n 1)"
            if [ -z "$paseo_pid" ]; then
              paseo_pid="$(cat "$pid_file" 2>/dev/null | tr -cd '0-9')"
            fi
            if [ -n "$paseo_pid" ]; then
              paseo_args="$(ps -o args= -p "$paseo_pid" 2>/dev/null || true)"
              if printf '%s' "$paseo_args" | grep -Eq 'daemon-runner|Paseo Supervisor|paseo daemon start'; then
                pkill -TERM -P "$paseo_pid" 2>/dev/null || true
                kill "$paseo_pid" 2>/dev/null || true
                sleep 1
                pkill -KILL -P "$paseo_pid" 2>/dev/null || true
                kill -KILL "$paseo_pid" 2>/dev/null || true
              fi
            fi
            rm -f "$pid_file" "$daemon_log"
          }
          if ! paseo_wait_ready; then
            paseo_stop_runner
            PASEO_HOME="$home/.paseo" paseo daemon start --listen 0.0.0.0:6767
            if ! paseo_wait_ready; then
              paseo_stop_runner
              PASEO_HOME="$home/.paseo" paseo daemon start --listen 0.0.0.0:6767
              paseo_wait_ready
            fi
          fi
      - path: /usr/local/bin/polaris-runtime-bootstrap
        permissions: '0755'
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          export PATH=/root/.local/node/bin:/root/.local/polaris/bin:$PATH
          /usr/local/bin/polaris-sync-shared-state sync-in
          /usr/local/bin/polaris-ensure-paseo-daemon
          test -f /root/.paseo/pairing.json
      - path: /etc/systemd/system/polaris-runtime-bootstrap.service
        permissions: '0644'
        content: |
          [Unit]
          Description=Polaris runtime bootstrap
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/polaris-runtime-bootstrap
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
    bootcmd:
      - /bin/sh -lc 'umount /workspace/project /mnt/polaris-shared/workspace-runtime-state /mnt/polaris-shared/user-identity-state /workspace/state /identity 2>/dev/null || true'
      - rm -rf /workspace /identity /mnt/polaris-shared
      - mkdir -p /workspace/project /workspace/state /identity /mnt/polaris-shared/workspace-runtime-state /mnt/polaris-shared/user-identity-state
      - /bin/sh -lc 'mountpoint -q /workspace/project || mount -t virtiofs workspace-data /workspace/project'
      - /bin/sh -lc 'mountpoint -q /mnt/polaris-shared/workspace-runtime-state || mount -t virtiofs workspace-runtime-state /mnt/polaris-shared/workspace-runtime-state'
      - /bin/sh -lc 'mountpoint -q /mnt/polaris-shared/user-identity-state || mount -t virtiofs user-identity-state /mnt/polaris-shared/user-identity-state'
      - /bin/sh -lc 'rm -rf /root/.npm /workspace/state/tooling 2>/dev/null || true; mkdir -p /workspace/state /workspace/state/paseo /workspace/state/paseo/evolution /workspace/state/paseo/evolution/sessions/bootstrap /identity/codex /identity/claude /identity/copilot /identity/opencode/config /identity/opencode/data /identity/pi/agent /identity/ssh /identity/polaris/credentials /identity/codex-xdg/config /identity/codex-xdg/data /identity/codex-xdg/state /mnt/polaris-shared/workspace-runtime-state/paseo /mnt/polaris-shared/workspace-runtime-state/paseo/evolution /mnt/polaris-shared/workspace-runtime-state/tooling/polaris /mnt/polaris-shared/user-identity-state/codex /mnt/polaris-shared/user-identity-state/claude /mnt/polaris-shared/user-identity-state/copilot /mnt/polaris-shared/user-identity-state/opencode/config /mnt/polaris-shared/user-identity-state/opencode/data /mnt/polaris-shared/user-identity-state/pi/agent /mnt/polaris-shared/user-identity-state/ssh /mnt/polaris-shared/user-identity-state/polaris/credentials /mnt/polaris-shared/user-identity-state/codex-xdg/config /mnt/polaris-shared/user-identity-state/codex-xdg/data /mnt/polaris-shared/user-identity-state/codex-xdg/state /run/workspace/tmp /root/.local /root/.local/node /root/.npm'
      - /bin/sh -lc 'ln -sfn /mnt/polaris-shared/workspace-runtime-state/tooling /workspace/state/tooling'
      - /bin/sh -lc 'rm -rf /root/.codex /root/.claude /root/.copilot /root/.pi /root/.config/opencode /root/.local/share/opencode /root/.paseo /root/.ssh /root/workspace; mkdir -p /root/.config /root/.local/share; ln -sfn /identity/codex /root/.codex; ln -sfn /identity/claude /root/.claude; ln -sfn /identity/copilot /root/.copilot; ln -sfn /identity/pi /root/.pi; ln -sfn /identity/opencode/config /root/.config/opencode; ln -sfn /identity/opencode/data /root/.local/share/opencode; ln -sfn /workspace/state/paseo /root/.paseo; ln -sfn /identity/ssh /root/.ssh; ln -sfn /workspace/project /root/workspace'
      - /bin/sh -lc 'rm -rf /root/.local/polaris; ln -sfn /workspace/state/tooling/polaris /root/.local/polaris'
      - chmod 1777 /run/workspace/tmp
      - /bin/sh -lc 'rm -f /var/lib/cloud/instance/sem/config_scripts_user /var/lib/cloud/instance/sem/scripts_user /var/lib/cloud/instance/sem/config_runcmd 2>/dev/null || true; find /var/lib/cloud/instances -path "*/sem/*" \( -name "config_scripts_user" -o -name "scripts_user" -o -name "config_runcmd" \) -delete 2>/dev/null || true'
      - python3 -c "import base64, pathlib; p = pathlib.Path('/mnt/polaris-shared/user-identity-state/codex/auth.json'); p.parent.mkdir(parents=True, exist_ok=True); (not p.exists()) and p.write_bytes(base64.b64decode('__CODEX_AUTH_JSON_B64__'))"
      - python3 -c "import base64, pathlib; p = pathlib.Path('/mnt/polaris-shared/user-identity-state/codex/config.toml'); p.parent.mkdir(parents=True, exist_ok=True); (not p.exists()) and p.write_bytes(base64.b64decode('__CODEX_CONFIG_TOML_B64__'))"
      - python3 -c "import base64, pathlib; p = pathlib.Path('/mnt/polaris-shared/user-identity-state/claude/settings.json'); p.parent.mkdir(parents=True, exist_ok=True); (not p.exists()) and p.write_bytes(base64.b64decode('__CLAUDE_SETTINGS_JSON_B64__'))"
    runcmd:
      - /bin/sh -lc 'if ! command -v git >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1 || ! command -v nvim >/dev/null 2>&1 || ! command -v rg >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1 || ! command -v tmux >/dev/null 2>&1 || ! command -v zsh >/dev/null 2>&1 || ! test -x /usr/sbin/sshd || ! command -v bwrap >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash bubblewrap ca-certificates curl fd-find git jq neovim openssh-client openssh-server procps python3 ripgrep rsync tmux wget xdg-utils zsh xz-utils; fi'
      - /bin/sh -lc 'if [ -x /root/guest-firstboot.sh ]; then sh /root/guest-firstboot.sh && rm -f /root/guest-firstboot.sh; fi'
      - /bin/sh -lc 'if [ ! -x /root/.local/node/bin/node ]; then rm -rf /root/.local/node/* && curl -fsSL https://nodejs.org/dist/v20.19.2/node-v20.19.2-linux-x64.tar.xz -o /tmp/node.tar.xz && tar -xJf /tmp/node.tar.xz -C /root/.local/node --strip-components=1 && rm -f /tmp/node.tar.xz; fi'
      - /bin/sh -lc '/usr/local/bin/polaris-sync-shared-state sync-in'
      - /bin/sh -lc 'if [ ! -x /root/.local/polaris/bin/paseo ]; then PATH=/root/.local/node/bin:$PATH NPM_CONFIG_PREFIX=/root/.local/polaris npm_config_cache=/root/.npm /root/.local/node/bin/npm install -g @getpaseo/cli@latest @openai/codex @anthropic-ai/claude-code @fission-ai/openspec@latest pnpm; fi'
      - /bin/sh -lc 'printf "%s\n" "#!/usr/bin/env bash" "set -euo pipefail" "export PATH=/root/.local/node/bin:/root/.local/polaris/bin:\$PATH" "exec /root/.local/polaris/bin/paseo \"\$@\"" > /usr/local/bin/paseo && chmod 755 /usr/local/bin/paseo'
      - /bin/sh -lc 'printf "%s\n" "#!/usr/bin/env bash" "set -euo pipefail" "export PATH=/root/.local/node/bin:/root/.local/polaris/bin:\$PATH" "exec /root/.local/polaris/bin/pnpm \"\$@\"" > /usr/local/bin/pnpm && chmod 755 /usr/local/bin/pnpm'
      - /bin/sh -lc 'printf "%s\n" "#!/usr/bin/env bash" "set -euo pipefail" "export PATH=/root/.local/node/bin:/root/.local/polaris/bin:\$PATH" "export CODEX_HOME=/root/.codex" "export XDG_CONFIG_HOME=/identity/codex-xdg/config" "export XDG_DATA_HOME=/identity/codex-xdg/data" "export XDG_STATE_HOME=/identity/codex-xdg/state" "export NPM_CONFIG_PREFIX=/root/.local/polaris" "export npm_config_cache=/root/.npm" "mkdir -p /root/.codex /identity/codex-xdg/config /identity/codex-xdg/data /identity/codex-xdg/state" "exec /root/.local/polaris/bin/codex \"\$@\"" > /usr/local/bin/codex && chmod 755 /usr/local/bin/codex'
      - /bin/sh -lc 'printf "%s\n" "#!/usr/bin/env bash" "set -euo pipefail" "export PATH=/root/.local/node/bin:/root/.local/polaris/bin:\$PATH" "export NPM_CONFIG_PREFIX=/root/.local/polaris" "export npm_config_cache=/root/.npm" "exec /root/.local/polaris/bin/claude \"\$@\"" > /usr/local/bin/claude && chmod 755 /usr/local/bin/claude'
      - /bin/sh -lc 'python3 -c "import json, pathlib; path = pathlib.Path(\"/root/.paseo/config.json\"); data = json.loads(path.read_text()) if path.exists() else {}; data.setdefault(\"daemon\", {})[\"listen\"] = \"0.0.0.0:6767\"; __PASEO_APP_BASE_URL_ASSIGNMENT__ path.parent.mkdir(parents=True, exist_ok=True); path.write_text(json.dumps(data, indent=2) + \"\\n\")"'
      - /bin/sh -lc 'printf "%s\n" "PermitRootLogin yes" "PubkeyAuthentication yes" "PasswordAuthentication yes" "KbdInteractiveAuthentication no" "StrictModes no" "PermitEmptyPasswords no" "UsePAM no" >/etc/ssh/sshd_config.d/99-polaris-runtime.conf'
      - /bin/sh -lc 'mkdir -p /run/sshd && systemctl enable ssh >/dev/null 2>&1 || true; systemctl restart ssh'
      - /bin/sh -lc 'mkdir -p /identity/ssh && chmod 700 /identity/ssh || true; touch /identity/ssh/known_hosts && chmod 600 /identity/ssh/known_hosts || true; if command -v ssh-keyscan >/dev/null 2>&1 && ! ssh-keygen -F github.com -f /identity/ssh/known_hosts >/dev/null 2>&1; then ssh-keyscan -H github.com >> /identity/ssh/known_hosts 2>/dev/null || true; fi'
      - /bin/sh -lc 'systemctl daemon-reload && systemctl enable --now polaris-runtime-bootstrap.service'
