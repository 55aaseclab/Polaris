apiVersion: v1
kind: Secret
metadata:
  name: morpheus-vm-cloudinit
  namespace: morpheus
type: Opaque
stringData:
  userdata: |-
    #cloud-config
    package_update: true
    packages:
      - openssh-client
      - openssh-server
      - bash
      - bat
      - bubblewrap
      - build-essential
      - ca-certificates
      - curl
      - docker.io
      - fd-find
      - git
      - htop
      - jq
      - libasound2t64
      - nodejs
      - npm
      - python3
      - python3-pip
      - qemu-guest-agent
      - ripgrep
      - sudo
      - wget
      - xdg-utils
    bootcmd:
      - mkdir -p /workspace /var/lib/agent-runtime
      - mountpoint -q /workspace || mount -t virtiofs projectfs /workspace
    runcmd:
      - /bin/sh -lc '[ -f /workspace/agent-runtime.ext4.img ] || truncate -s 80G /workspace/agent-runtime.ext4.img'
      - /bin/sh -lc 'blkid /workspace/agent-runtime.ext4.img >/dev/null 2>&1 || /usr/sbin/mkfs.ext4 -F /workspace/agent-runtime.ext4.img'
      - mkdir -p /var/lib/agent-runtime
      - mountpoint -q /var/lib/agent-runtime || mount -o loop /workspace/agent-runtime.ext4.img /var/lib/agent-runtime
      - mkdir -p /var/lib/agent-runtime/codex-home/.codex
      - mkdir -p /var/lib/agent-runtime/claude
      - mkdir -p /var/lib/agent-runtime/paseo
      - mkdir -p /var/lib/agent-runtime/ssh
      - mkdir -p /var/lib/agent-runtime/docker
      - mkdir -p /var/lib/agent-runtime/agent-cli
      - mkdir -p /var/lib/agent-runtime/cargo
      - mkdir -p /var/lib/agent-runtime/rustup
      - mkdir -p /var/lib/agent-runtime/npm-cache
      - mkdir -p /root/.local
      - rm -rf /root/.codex /root/.claude /root/.paseo /root/.ssh /root/.cargo /root/.rustup /root/.npm /root/.local/agent-cli
      - ln -s /var/lib/agent-runtime/codex-home/.codex /root/.codex
      - ln -s /var/lib/agent-runtime/claude /root/.claude
      - ln -s /var/lib/agent-runtime/paseo /root/.paseo
      - ln -s /var/lib/agent-runtime/ssh /root/.ssh
      - ln -s /var/lib/agent-runtime/cargo /root/.cargo
      - ln -s /var/lib/agent-runtime/rustup /root/.rustup
      - ln -s /var/lib/agent-runtime/npm-cache /root/.npm
      - ln -s /var/lib/agent-runtime/agent-cli /root/.local/agent-cli
      - /bin/sh -lc 'if [ ! -L /root/Morpheus ]; then rm -rf /root/Morpheus; ln -s /workspace/Morpheus /root/Morpheus; fi'
      - /bin/sh -lc 'if [ ! -f /root/.ssh/id_ed25519 ] && [ -f /workspace/.ssh/id_ed25519 ]; then cp -f /workspace/.ssh/id_ed25519 /root/.ssh/id_ed25519 && chmod 600 /root/.ssh/id_ed25519; fi'
      - /bin/sh -lc 'if [ ! -f /root/.ssh/id_ed25519.pub ] && [ -f /workspace/.ssh/id_ed25519.pub ]; then cp -f /workspace/.ssh/id_ed25519.pub /root/.ssh/id_ed25519.pub && chmod 644 /root/.ssh/id_ed25519.pub; fi'
      - /bin/sh -lc 'if [ ! -f /root/.ssh/known_hosts ] && [ -f /workspace/.ssh/known_hosts ]; then cp -f /workspace/.ssh/known_hosts /root/.ssh/known_hosts && chmod 644 /root/.ssh/known_hosts; fi'
      - |
        cat >/root/.codex/auth.json <<'EOF'
        __CODEX_AUTH_JSON__
        EOF
      - |
        cat >/root/.codex/config.toml <<'EOF'
        model_provider = "rightcode"
        model = "gpt-5.4"
        model_reasoning_effort = "medium"
        disable_response_storage = true

        model_context_window = 1000000
        model_auto_compact_token_limit = 900000
        approvals_reviewer = "user"

        [model_providers.rightcode]
        name = "rightcode"
        base_url = "https://right.codes/codex/v1"
        wire_api = "responses"
        requires_openai_auth = true
        EOF
      - |
        cat >/root/.claude/settings.json <<'EOF'
        __CLAUDE_SETTINGS_JSON__
        EOF
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | CARGO_HOME=/root/.cargo RUSTUP_HOME=/root/.rustup sh -s -- -y
      - npm install -g --prefix /root/.local/agent-cli @getpaseo/cli@latest @openai/codex @anthropic-ai/claude-code @fission-ai/openspec@latest pnpm
      - ln -sf /root/.local/agent-cli/bin/paseo /usr/local/bin/paseo
      - |
        cat >/etc/profile.d/codex-home.sh <<'EOF'
        export CODEX_HOME=/var/lib/agent-runtime/codex-home/.codex
        export NPM_CONFIG_PREFIX=/root/.local/agent-cli
        export npm_config_cache=/root/.npm
        export CARGO_HOME=/root/.cargo
        export RUSTUP_HOME=/root/.rustup
        EOF
      - chmod 644 /etc/profile.d/codex-home.sh
      - |
        cat >/usr/local/bin/codex <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        export CODEX_HOME=/var/lib/agent-runtime/codex-home/.codex
        export NPM_CONFIG_PREFIX=/root/.local/agent-cli
        export npm_config_cache=/root/.npm
        export CARGO_HOME=/root/.cargo
        export RUSTUP_HOME=/root/.rustup
        mkdir -p "${CODEX_HOME}"
        exec /root/.local/agent-cli/bin/codex "$@"
        EOF
      - chmod 755 /usr/local/bin/codex
      - |
        cat >/usr/local/bin/claude <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        export NPM_CONFIG_PREFIX=/root/.local/agent-cli
        export npm_config_cache=/root/.npm
        exec /root/.local/agent-cli/bin/claude "$@"
        EOF
      - chmod 755 /usr/local/bin/claude
      - mkdir -p /etc/docker
      - |
        cat >/etc/docker/daemon.json <<'EOF'
        {
          "data-root": "/var/lib/agent-runtime/docker",
          "mtu": 1450
        }
        EOF
      - |
        cat >/etc/systemd/system/paseo-daemon.service <<'EOF'
        [Unit]
        Description=Paseo daemon
        After=network-online.target docker.service
        Wants=network-online.target

        [Service]
        Type=simple
        Environment=PASEO_HOME=/root/.paseo
        ExecStart=/root/.local/agent-cli/bin/paseo daemon start --foreground --listen 0.0.0.0:6767
        ExecStop=/bin/sh -lc '/root/.local/agent-cli/bin/paseo daemon stop || true'
        Restart=on-failure
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
        EOF
      - systemctl daemon-reload
      - mkdir -p /var/lib/agent-ssh
      - /bin/sh -lc 'if [ -f /root/.ssh/id_ed25519 ]; then cp -f /root/.ssh/id_ed25519 /var/lib/agent-ssh/id_ed25519 && chmod 600 /var/lib/agent-ssh/id_ed25519; fi'
      - /bin/sh -lc 'if [ -f /root/.ssh/id_ed25519.pub ]; then cp -f /root/.ssh/id_ed25519.pub /var/lib/agent-ssh/id_ed25519.pub && chmod 644 /var/lib/agent-ssh/id_ed25519.pub; fi'
      - HOME=/root git config --global core.editor vi
      - HOME=/root git config --global core.sshCommand "ssh -i /var/lib/agent-ssh/id_ed25519 -o IdentitiesOnly=yes"
      - HOME=/root git config --global pull.rebase true
      - HOME=/root git config --global user.name "Qiang Liu"
      - HOME=/root git config --global user.email "cyruscyliu@gmail.com"
      - systemctl enable --now docker
      - systemctl restart docker
      - systemctl enable --now qemu-guest-agent
      - systemctl enable --now ssh
      - systemctl enable --now paseo-daemon
      - ssh-keygen -q -t ed25519 -C morpheus@agent-vault -N '' -f /root/.ssh/id_ed25519 || true
      - /bin/sh -lc 'paired=0; for i in $(seq 1 30); do PASEO_HOME=/root/.paseo paseo daemon pair --json >/root/.paseo/pairing.json.tmp 2>/dev/null && mv /root/.paseo/pairing.json.tmp /root/.paseo/pairing.json && paired=1 && break; sleep 2; done; test "$paired" = 1'
