project: demo
user_profile: '100000000000000001'
backend:
  kind: kubevirt-vm
  spec_files:
    - config/kubevirt/specs/demo.agent.yaml
credentials:
  bindings:
    - purpose: agent-auth
      credentialId: demo-codex
      required: true
runtime:
  class: gvisor
  base_image: ttl.sh/polaris-demo-debian13-1782126452:24h
  rootdisk_image: ttl.sh/polaris-demo-kubevirt-rootdisk-1782200980:24h
  user: root
  privileged: null
  docker_enabled: true
resources:
  cpu: '8'
  memory: 16Gi
  ephemeral_storage: 120Gi
  cpu_request: '2'
  memory_request: 4Gi
  ephemeral_storage_request: 20Gi
  unbounded: true
agent:
  kind: multi
  label: Codex + Claude Code
  args: []
  persist_state: true
tooling:
  bootstrap_profile: prebuilt
  install_rustup: false
  git_core_editor: vi
env:
  plain: {}
service:
  enabled: true
  mode: nodeport
  ports:
    - container_port: '6767'
      node_port: '32677'
      name: paseo
  host: null
  path: /
attachments:
  workspace-data:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/project
    durable_paths:
      - /workspace/project
    source:
      kind: persistent-volume
      volume_ref: demo-workspace-data
      volume_size: 120Gi
      description: reusable workspace data for demo
  workspace-runtime-state:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/state
    durable_paths:
      - /workspace/state/paseo
      - /workspace/state/paseo/evolution
    source:
      kind: persistent-volume
      volume_ref: demo-workspace-runtime-state
      volume_size: 20Gi
      description: reusable workspace runtime state for demo
  user-identity-state:
    scope: user
    sharing: cross-workspace
    mount_root: /identity
    durable_paths:
      - /identity/codex
      - /identity/claude
    source:
      kind: persistent-volume
      volume_ref: demo-user-identity-state
      volume_size: 5Gi
      description: persistent user identity state for demo
  user-ssh-state:
    scope: user
    sharing: cross-workspace
    mount_root: /ssh
    durable_paths:
      - /ssh
    source:
      kind: persistent-volume
      volume_ref: demo-user-ssh-state
      volume_size: 1Gi
      description: persistent user SSH state for demo
  ephemeral-runtime:
    mount_root: /run/workspace
    paths:
      - /run/workspace/tmp
      - /run/workspace/pids
      - /run/workspace/sockets
    stale_artifacts:
      - /root/.paseo/paseo.pid
      - /run/workspace/pids/paseo.pid
profile: morpheus
