project: morph-base
backend:
  kind: pod
  spec_files: null
runtime:
  class: gvisor
  base_image: ttl.sh/morpheus-prebuilt-1781875178:24h
  user: root
  privileged: null
  docker_enabled: null
resources:
  cpu: '4'
  memory: 8Gi
  ephemeral_storage: 40Gi
  cpu_request: '1'
  memory_request: 2Gi
  ephemeral_storage_request: 10Gi
  unbounded: true
agent:
  kind: none
  label: None
  args: []
  persist_state: false
tooling:
  bootstrap_profile: minimal
  install_rustup: false
  git_core_editor: null
  git_user_name: null
  git_user_email: null
auth:
  files:
  - key: codex-auth.json
    mount_path: /root/.codex/auth.json
    source_path: /home/debian/Projects/geek-env/secrets/polaris/codex/auth.json
    content: null
  - key: codex-config.toml
    mount_path: /root/.codex/config.toml
    source_path: /home/debian/Projects/geek-env/secrets/polaris/codex/config.toml
    content: null
  - key: claude-settings.json
    mount_path: /root/.claude/settings.json
    source_path: /home/debian/Projects/geek-env/secrets/polaris/claude/settings.json
    content: null
env:
  plain: {}
service:
  enabled: false
  mode: null
  ports: []
  host: null
  path: /
attachments:
  workspace-data:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/project
    durable_paths:
    - /workspace/project
    source:
      kind: generated-material
      volume_ref: null
      description: ephemeral workspace storage for morph-base
  workspace-runtime-state:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/state
    durable_paths:
    - /workspace/state/paseo
    source:
      kind: generated-material
      volume_ref: null
      sub_path: state
      description: workspace runtime state for morph-base
  user-identity-state:
    scope: user
    sharing: cross-workspace
    mount_root: /identity
    durable_paths:
    - /identity/codex
    - /identity/claude
    source:
      kind: secret-material
      description: user identity material sourced from spec auth files
  user-ssh-state:
    scope: user
    sharing: cross-workspace
    mount_root: /ssh
    durable_paths:
    - /ssh
    source:
      kind: generated-material
      description: user SSH material
  ephemeral-runtime:
    mount_root: /run/workspace
    paths:
    - /run/workspace/tmp
    - /run/workspace/pids
    - /run/workspace/sockets
    stale_artifacts:
    - /root/.paseo/paseo.pid
    - /run/workspace/pids/paseo.pid
