project: morph-paseo-eph
user_profile: "100000000000000001"
backend:
  kind: pod
  spec_files: null
runtime:
  class: gvisor
  base_image: ttl.sh/morpheus-prebuilt-1781875178:24h
  user: root
  privileged: null
  docker_enabled: null
resources:
  cpu: '4'
  memory: 8Gi
  ephemeral_storage: 40Gi
  cpu_request: '1'
  memory_request: 2Gi
  ephemeral_storage_request: 10Gi
  unbounded: true
agent:
  kind: multi
  label: Codex + Claude Code
  args: []
  persist_state: false
tooling:
  bootstrap_profile: prebuilt
  install_rustup: true
  git_core_editor: vi
  git_user_name: Qiang Liu
  git_user_email: cyruscyliu@gmail.com
env:
  plain: {}
service:
  enabled: true
  mode: nodeport
  ports:
  - container_port: '6767'
    node_port: '31707'
    name: paseo
  host: null
  path: /
attachments:
  workspace-data:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/project
    durable_paths:
    - /workspace/project
    source:
      kind: generated-material
      volume_ref: null
      description: ephemeral workspace storage for morph-paseo-eph
  workspace-runtime-state:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/state
    durable_paths:
    - /workspace/state/paseo
    source:
      kind: generated-material
      volume_ref: null
      sub_path: state
      description: workspace runtime state for morph-paseo-eph
  user-identity-state:
    scope: user
    sharing: cross-workspace
    mount_root: /identity
    durable_paths:
    - /identity/codex
    - /identity/claude
    source:
      kind: secret-material
      description: user identity material sourced from spec auth files
  user-ssh-state:
    scope: user
    sharing: cross-workspace
    mount_root: /ssh
    durable_paths:
    - /ssh
    source:
      kind: generated-material
      description: user SSH material
  ephemeral-runtime:
    mount_root: /run/workspace
    paths:
    - /run/workspace/tmp
    - /run/workspace/pids
    - /run/workspace/sockets
    stale_artifacts:
    - /root/.paseo/paseo.pid
    - /run/workspace/pids/paseo.pid
profile: morpheus
