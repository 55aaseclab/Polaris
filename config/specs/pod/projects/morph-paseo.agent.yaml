project: morph-paseo
backend:
  kind: pod
  spec_files: null
runtime:
  class: gvisor
  base_image: ttl.sh/morpheus-prebuilt-1781875178:24h
  user: root
  privileged: null
  docker_enabled: null
resources:
  cpu: '6'
  memory: 12Gi
  ephemeral_storage: 80Gi
  cpu_request: '2'
  memory_request: 4Gi
  ephemeral_storage_request: 10Gi
  unbounded: true
agent:
  kind: none
  label: None
  args: []
  persist_state: true
tooling:
  bootstrap_profile: prebuilt
  install_rustup: true
  git_core_editor: vi
  git_user_name: Qiang Liu
  git_user_email: cyruscyliu@gmail.com
auth:
  files: []
env:
  plain: {}
service:
  enabled: true
  mode: nodeport
  ports:
  - container_port: '6767'
    node_port: '31687'
    name: paseo
  host: null
  path: /
attachments:
  workspace-data:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/project
    durable_paths:
    - /workspace/project
    source:
      kind: persistent-volume
      volume_ref: morph-paseo-project
      description: workspace-scoped persistent storage for morph-paseo
  workspace-runtime-state:
    scope: workspace
    sharing: exclusive
    mount_root: /workspace/state
    durable_paths:
    - /workspace/state/paseo
    source:
      kind: persistent-volume
      volume_ref: morph-paseo-project
      sub_path: state
      description: workspace runtime state for morph-paseo
  user-identity-state:
    scope: user
    sharing: cross-workspace
    mount_root: /identity
    durable_paths:
    - /identity/codex
    - /identity/claude
    source:
      kind: secret-material
      description: user identity material
  user-ssh-state:
    scope: user
    sharing: cross-workspace
    mount_root: /ssh
    durable_paths:
    - /ssh
    source:
      kind: generated-material
      description: user SSH material
  ephemeral-runtime:
    mount_root: /run/workspace
    paths:
    - /run/workspace/tmp
    - /run/workspace/pids
    - /run/workspace/sockets
    stale_artifacts:
    - /root/.paseo/paseo.pid
    - /run/workspace/pids/paseo.pid
