schema_version: clue.polaris.business.config.v1
workspace:
  root_env: POLARIS_BUSINESS_WORKSPACES_ROOT
tools:
  data-collection:
    executable: tools/data-collection/clue-data-collection
  intelligence-analysis:
    executable: tools/intelligence-analysis/clue-intelligence-analysis
  report-writing:
    executable: tools/report-writing/clue-report-writing
  outreach:
    executable: tools/outreach/clue-outreach
  content-production:
    executable: tools/content-production/polaris-content-production
  product-video:
    executable: tools/product-video/polaris-product-video
# tools/ directories not referenced in the workflow-templates below:
#   tools/data-collection/literature — retained temporarily for mixed-tool
#     compatibility while the remaining Polaris business surface is retired
#   tools/logistics-management — order/logistics ops templates (not workflow stages)
#   tools/物流管理               — Chinese alias/docs for logistics (not a CLI stage)
# Note: tools/augmentation was merged into tools/data-collection (phase 2).
# Literature Review execution is owned by Polaris; this legacy template is
# retained only while old workspace metadata is drained and must not be used
# for new runs.
workflow-templates:
  free-discussion:
    category: free-discussion
    stages:
      discussion:
        steps: []
  literature-review:
    category: literature-review
    stages:
      data-collection:
        input_prompt:
          method: generate-file
          instruction: >
            Generate the JSON input file for the data-collection stage. It
            should define the collection target, source selection, scope,
            filtering bounds, and review mode needed for this literature-review
            task.
          output_kind: json
        # Optional stage: leave steps empty to reuse a prepared outputs/output.json.
        #
        # tools/data-collection (clue-data-collection) run = three phases only:
        #   phase 1 = collection
        #   phase 2 = augmentation
        #   phase 3 = manual-review
        #
        # phase 1 — collection
        #   source tools + builtin normalize
        #   optional payload.pdf_links → list candidate URLs only (no download)
        #   → work/collection-output.json
        #   literature source execution is now owned by Polaris.
        #     curated-web-search (optional)  → tools/web-search (+ source-catalog.json)
        #   removed: tools/google-scholar, openalex (old source_types skipped)
        #   expansion: Semantic Scholar citations/refs + Crossref reference DOIs
        #              (dual-source merge by DOI) + literature_graph DOT
        #   bounds: literature_scope (CCF A/B/C, last 5y, arXiv CoRR); no paper-count cap
        #   customer-leads source tools (legacy acquisition/…):
        #     tools/google-map | tools/web-search
        #     tools/industry-directories | tools/social-media
        #
        # phase 2 — augmentation  (NOT manual-review)
        #   flat modules under tools/data-collection/ (no tools/augmentation):
        #     customer_leads.py  — preprocess | augment | review-list | non-review-results
        #     website.py         — bounded HTTP fetch for customer-leads
        #     pdf_capture.py     — literature PDF via tools/browser (camofox)
        #   literature + pdf_links → pdf_capture → pdfs/ + updated pdf_links
        #   literature without pdf_links → review-required flags only
        #   customer-leads → ./clue-data-collection preprocess|augment …
        #   → work/augmentation-output.json
        #
        # phase 3 — manual-review  (NOT augmentation)
        #   pipeline.review_mode: auto-pass | auto-approve | manual-review
        #   default auto-pass: status final without a human queue
        #   auto-approve: status final with automatic approval provenance
        #   manual-review: pending_manual_review + manual-review-list.json
        #   interactive: the admin portal opens manual-review-list.json
        #   → outputs/output.json
        #
        # clue-data-collection CLI:
        #   version | validate-input | validate-output | list-sources | run
        #   phase-2 customer: preprocess | augment | review-list | non-review-results
        # collection_kind: customer-leads | literature
        #
        # Example step (disabled by default):
        # - id: collect-literature
        #   tool: data-collection
        #   command: run
        #   args:
        #     - --input
        #     - "{{data_collection_input}}"
        #     - --workspace
        #     - "{{workspace_id}}"
        #     - --run-prefix
        #     - "{{workflow_id}}"
        #     - --output
        #     - "{{collection_output}}"
        #     - --review-mode
        #     - auto-approve
        steps:
          - id: collect-literature
            tool: data-collection
            command: run
            args:
              - --input
              - "{{data_collection_input}}"
              - --workspace
              - "{{workspace_id}}"
              - --run-prefix
              - "{{workflow_id}}"
              - --output
              - "{{collection_output}}"
              - --review-mode
              - auto-approve
      intelligence-analysis:
        input_prompt:
          method: derive
          instruction: >
            Derive the intelligence-analysis input JSON from the current stage
            fields, the upstream collection output, and the configured review
            policy. Preserve the evidence-bound research question and synthesis
            constraints.
          output_kind: json
        question: >
          What does the collected literature establish about the research
          question?
        question_prompt:
          method: generate-text
          instruction: >
            Restate the literature-review topic as the single evidence-bound
            research question that the intelligence-analysis stage should answer.
          output_kind: text
        decision_context: >
          Establish an evidence-bound starting point for research and
          engineering.
        decision_context_prompt:
          method: generate-text
          instruction: >
            Explain why this literature-analysis question matters, what decision
            or design direction it should support, and which constraints should
            shape the synthesis.
          output_kind: text
        audience: research and engineering
        audience_prompt:
          method: derive
          instruction: >
            Derive the primary audience for this literature-analysis result from
            the workflow task, intended report readers, and downstream research
            consumers.
          output_kind: text
        review_policy:
          minimum_confidence: 0.75
          review_all_claims: true
          mode: auto-pass
        depends_on:
          - stage: data-collection
            reference_path: inputs/input.json
            sha256_path: collection_ref.collection_output_sha256
        # Optional stage: reuse prepared outputs/output.json when steps is empty.
        # tools/intelligence-analysis (clue-intelligence-analysis) CLI:
        #   version | validate-input | validate-output | prepare | run | finalize
        # analysis_kind:
        #   literature-review | ad-content-review | business-analysis | product-analysis
        # Example step (disabled by default):
        # - id: analyze-literature
        #   tool: intelligence-analysis
        #   command: run
        #   args:
        #     - --input
        #     - "{{analysis_input}}"
        #     - --analysis-root
        #     - "{{analysis_root}}"
        steps:
          - id: analyze-literature
            tool: intelligence-analysis
            command: run
            args:
              - --input
              - "{{analysis_input}}"
              - --analysis-root
              - "{{analysis_root}}"
      report-writing:
        # Prefer literature-report for survey-style synthesis with search_scope
        # and fused findings/evidence (see tools/report-writing templates).
        template: literature-report
        template_prompt:
          method: derive
          instruction: >
            Choose the report template that best matches the analysis outcome
            and audience. Prefer literature-report for survey-style synthesis
            with search scope; use research-brief for non-decision summaries.
          output_kind: text
        report_input_prompt:
          method: derive
          instruction: >
            Derive the report-writing input JSON from the analysis output, the
            selected report template, and the expected report artifacts so the
            writing stage can draft and publish the literature report.
          output_kind: json
        output_path: outputs/report.pdf
        depends_on:
          - stage: intelligence-analysis
            reference_path: inputs/input.json
            sha256_path: source.analysis_output_sha256
            allow_canonical_json: true
        # Optional stage: reuse prepared report artifacts when steps is empty.
        # tools/report-writing (clue-report-writing) CLI:
        #   version | templates | prepare | draft | review | revise
        #   publish | preview | pdf | latex | run
        # templates:
        #   literature-report | intelligence-report | risk-brief | decision-memo
        #   research-brief | system-framework | auto
        # Example step (disabled by default in the template; enable per workflow):
        # - id: write-report
        #   tool: report-writing
        #   command: run
        #   args:
        #     - --analysis-output
        #     - "{{analysis_output}}"
        #     - --template
        #     - "{{report_template}}"
        #     - --report-input
        #     - "{{report_input}}"
        #     - --draft
        #     - "{{report_draft}}"
        #     - --tex
        #     - "{{report_tex}}"
        #     - --bib
        #     - "{{report_bib}}"
        #     - --output
        #     - "{{report_pdf}}"
        #     - --run-dir
        #     - "{{report_root}}/runs/workflow-draft"
        steps:
          - id: write-report
            tool: report-writing
            command: run
            args:
              - --analysis-output
              - "{{analysis_output}}"
              - --template
              - "{{report_template}}"
              - --report-input
              - "{{report_input}}"
              - --draft
              - "{{report_draft}}"
              - --tex
              - "{{report_tex}}"
              - --bib
              - "{{report_bib}}"
              - --output
              - "{{report_pdf}}"
              - --run-dir
              - "{{report_root}}/runs/workflow-draft"
  customer-acquisition:
    category: customer-acquisition
    stages:
      data-collection:
        # A customer collection may be prepared independently before the
        # workflow starts. Its normalized v2 output is the phase handoff.
        steps: []
      outreach:
        depends_on:
          - stage: data-collection
            reference_path: outputs/output.json
            sha256_path: collection_ref.collection_output_sha256
        steps:
          - id: sync-outreach
            tool: outreach
            command: sync
            args:
              - --workspace
              - "{{workspace_id}}"
              - --collection-output
              - "{{collection_output}}"
              - --outreach-root
              - "{{outreach_root}}"
              - --outreach-id
              - "{{outreach_id}}"
  product-gallery:
    category: product-gallery
    stages:
      content-production:
        steps:
          - id: build-product-gallery
            tool: content-production
            command: run
            args:
              - --workspace-root
              - "{{workspace_root}}"
              - --input
              - "{{content_production_input}}"
  # 广告与内容情报：公开内容/广告素材采集 → 内容情报分析（非获客、非文献）。
  # DC first (collection_kind: ad-content-intel); IA uses analysis_kind:
  # ad-content-review (executor empty — freeze + empty judgments only).
  ad-content-intel:
    category: ad-content-intel
    stages:
      data-collection:
        # Prepare inputs/input.json with collection_kind: ad-content-intel.
        # Source tools: social-media (xiaohongshu/…) / web-search.
        #
        # Example step (enable per concrete workflow when sources exist):
        # - id: collect-ad-content
        #   tool: data-collection
        #   command: run
        #   args:
        #     - --input
        #     - "{{data_collection_input}}"
        #     - --workspace
        #     - "{{workspace_id}}"
        #     - --run-prefix
        #     - "{{workflow_id}}"
        #     - --review-mode
        #     - auto-approve
        steps: []
      intelligence-analysis:
        # analysis_kind: ad-content-review → synthesize-v0 judgments.
        question: >
          What does the collected public content/ad material show for the
          research or ops question?
        decision_context: >
          Content and creative intelligence from social/web discovery.
        audience: content and growth ops
        review_policy:
          minimum_confidence: 0.55
          review_all_claims: false
          mode: auto-pass
        depends_on:
          - stage: data-collection
            reference_path: inputs/input.json
            sha256_path: collection_ref.collection_output_sha256
        steps: []
      report-writing:
        # template auto → ad-content-report when analysis_kind is ad-content-review.
        template: ad-content-report
        output_path: outputs/report.md
        depends_on:
          - stage: intelligence-analysis
            reference_path: inputs/input.json
        steps: []
