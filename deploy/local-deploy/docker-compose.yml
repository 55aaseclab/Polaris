services:
  paseo-app:
    image: ${POLARIS_LOCAL_DEPLOY_PASEO_IMAGE}
    restart: unless-stopped
    expose:
      - "8082"

  polaris-control-plane:
    image: ${POLARIS_LOCAL_DEPLOY_CONTROL_PLANE_IMAGE}
    environment:
      POLARIS_DATA_ROOT: /workspace/polaris-data
      POLARIS_EXECUTOR_BASE_URL: http://127.0.0.1:8788
      POLARIS_EXECUTOR_SHARED_SECRET: ${POLARIS_EXECUTOR_SHARED_SECRET:-}
      POLARIS_PASEO_APP_BASE_URL: ${POLARIS_PASEO_APP_BASE_URL:-}
      POLARIS_APP_VERSION: ${POLARIS_APP_VERSION:-}
      POLARIS_RELEASE_CHANNEL: ${POLARIS_RELEASE_CHANNEL:-stable}
      POLARIS_TELEMETRY_ENABLED: ${POLARIS_TELEMETRY_ENABLED:-}
      POLARIS_POSTHOG_API_KEY: ${POLARIS_POSTHOG_API_KEY:-}
      POLARIS_POSTHOG_HOST: ${POLARIS_POSTHOG_HOST:-}
      POLARIS_SENTRY_DSN: ${POLARIS_SENTRY_DSN:-}
      POLARIS_SENTRY_ENVIRONMENT: ${POLARIS_SENTRY_ENVIRONMENT:-}
      POLARIS_TELEMETRY_ENVIRONMENT: ${POLARIS_TELEMETRY_ENVIRONMENT:-}
      AUTHING_APP_ID: ${AUTHING_APP_ID:-}
      AUTHING_ISSUER: ${AUTHING_ISSUER:-}
      AUTHING_JWKS_URL: ${AUTHING_JWKS_URL:-}
      POLARIS_BOOTSTRAP_ADMIN_USERS: ${POLARIS_BOOTSTRAP_ADMIN_USERS:-}
    command:
      - /bin/sh
      - -lc
      - >
        node apps/polaris/dist/scripts/polaris.js executor 8788 127.0.0.1 &
        exec node apps/polaris/dist/scripts/polaris.js server 8787 0.0.0.0
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - ${POLARIS_DATA_ROOT}:/workspace/polaris-data

  polaris-webportal:
    image: ${POLARIS_LOCAL_DEPLOY_WEB_IMAGE}
    environment:
      VITE_POLARIS_APP_VERSION: ${VITE_POLARIS_APP_VERSION:-}
      VITE_POLARIS_RELEASE_CHANNEL: ${VITE_POLARIS_RELEASE_CHANNEL:-stable}
      VITE_POLARIS_TELEMETRY_ENABLED: ${VITE_POLARIS_TELEMETRY_ENABLED:-}
      VITE_POLARIS_POSTHOG_KEY: ${VITE_POLARIS_POSTHOG_KEY:-}
      VITE_POLARIS_POSTHOG_HOST: ${VITE_POLARIS_POSTHOG_HOST:-}
      VITE_POLARIS_SENTRY_DSN: ${VITE_POLARIS_SENTRY_DSN:-}
      VITE_POLARIS_SENTRY_ENVIRONMENT: ${VITE_POLARIS_SENTRY_ENVIRONMENT:-}
    restart: unless-stopped
    expose:
      - "80"

  polaris-local-gateway:
    image: nginx:1.27-alpine
    depends_on:
      - paseo-app
      - polaris-control-plane
      - polaris-webportal
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_HTTP_PORT: 80
      POLARIS_SERVER_UPSTREAM: polaris-control-plane:8787
      POLARIS_WEBPORTAL_UPSTREAM: polaris-webportal:80
      PASEO_APP_UPSTREAM: paseo-app:8082
    restart: unless-stopped
    ports:
      - "${POLARIS_LOCAL_DEPLOY_PORT:-18081}:80"
    volumes:
      - ./nginx:/etc/nginx/templates:ro
