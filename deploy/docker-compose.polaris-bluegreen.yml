services:
  paseo-app:
    build:
      context: ..
      dockerfile: apps/paseo/Dockerfile
    restart: unless-stopped
    ports:
      - "${PASEO_APP_BIND_HOST:-127.0.0.1}:${PASEO_APP_PORT:-8082}:8082"
    expose:
      - "8082"

  polaris-server:
    build:
      context: ..
      dockerfile: apps/polaris/Dockerfile
    user: "${POLARIS_SERVER_UID:-1000}:${POLARIS_SERVER_GID:-1000}"
    environment:
      POLARIS_DATA_ROOT: /workspace/polaris-data
      POLARIS_EXECUTOR_BASE_URL: ${POLARIS_EXECUTOR_BASE_URL:-http://host.docker.internal:8788}
      POLARIS_EXECUTOR_SHARED_SECRET: ${POLARIS_EXECUTOR_SHARED_SECRET:-}
      POLARIS_BOOTSTRAP_ADMIN_USERS: ${POLARIS_BOOTSTRAP_ADMIN_USERS:-}
      POLARIS_DEFAULT_CODEX_RIGHTCODE_API_KEY: ${POLARIS_DEFAULT_CODEX_RIGHTCODE_API_KEY:-}
      POLARIS_PASEO_APP_BASE_URL: ${POLARIS_PASEO_APP_BASE_URL:-}
      AUTHING_APP_ID: ${AUTHING_APP_ID:-}
      AUTHING_ISSUER: ${AUTHING_ISSUER:-}
      AUTHING_JWKS_URL: ${AUTHING_JWKS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "${POLARIS_SERVER_BIND_HOST:-127.0.0.1}:${POLARIS_SERVER_PORT:-8787}:8787"
    expose:
      - "8787"
    volumes:
      - ${POLARIS_DATA_ROOT}:/workspace/polaris-data

  polaris-webportal:
    build:
      context: ..
      dockerfile: apps/polaris-web/Dockerfile
      args:
        VITE_POLARIS_API_BASE: ${VITE_POLARIS_API_BASE:-/api}
        VITE_PASEO_APP_BASE_URL: ${VITE_PASEO_APP_BASE_URL:-}
        VITE_AUTHING_APP_ID: ${VITE_AUTHING_APP_ID:-}
        VITE_AUTHING_AUTHORIZATION_URL: ${VITE_AUTHING_AUTHORIZATION_URL:-}
        VITE_AUTHING_TOKEN_URL: ${VITE_AUTHING_TOKEN_URL:-}
        VITE_AUTHING_LOGOUT_URL: ${VITE_AUTHING_LOGOUT_URL:-}
        VITE_AUTHING_REDIRECT_URI: ${VITE_AUTHING_REDIRECT_URI:-}
    restart: unless-stopped
    ports:
      - "${POLARIS_WEBPORTAL_BIND_HOST:-127.0.0.1}:${POLARIS_WEBPORTAL_PORT:-8081}:80"
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - paseo-app
      - polaris-server
      - polaris-webportal
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      POLARIS_SERVER_UPSTREAM: ${POLARIS_SERVER_UPSTREAM:-127.0.0.1:${POLARIS_SERVER_PORT:-8787}}
      POLARIS_WEBPORTAL_UPSTREAM: ${POLARIS_WEBPORTAL_UPSTREAM:-127.0.0.1:${POLARIS_WEBPORTAL_PORT:-8081}}
      PASEO_APP_UPSTREAM: ${PASEO_APP_UPSTREAM:-127.0.0.1:${PASEO_APP_PORT:-8082}}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../docker/nginx/templates:/etc/nginx/templates:ro
