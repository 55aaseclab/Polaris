services:
  landing-page:
    build:
      context: ..
      dockerfile: apps/landing-page/Dockerfile
      args:
        VITE_PASEO_APP_BASE_URL: ${VITE_PASEO_APP_BASE_URL:-/welcome}
        VITE_BASE_PATH: ${VITE_LANDING_PAGE_BASE_PATH:-/}
    restart: unless-stopped
    ports:
      - "${POLARIS_LANDING_PAGE_BIND_HOST:-127.0.0.1}:${POLARIS_LANDING_PAGE_PORT:-5173}:5173"
    expose:
      - "5173"

  paseo-app:
    build:
      context: ..
      dockerfile: apps/paseo/Dockerfile
    restart: unless-stopped
    ports:
      - "${PASEO_APP_BIND_HOST:-127.0.0.1}:${PASEO_APP_PORT:-8082}:8082"
    expose:
      - "8082"

  polaris-server:
    build:
      context: ..
      dockerfile: apps/polaris/Dockerfile
    user: "${POLARIS_SERVER_UID:-1000}:${POLARIS_SERVER_GID:-1000}"
    environment:
      POLARIS_DATA_ROOT: /workspace/polaris-data
      POLARIS_EXECUTOR_BASE_URL: ${POLARIS_EXECUTOR_BASE_URL:-http://host.docker.internal:8788}
      POLARIS_EXECUTOR_SHARED_SECRET: ${POLARIS_EXECUTOR_SHARED_SECRET:-}
      POLARIS_BOOTSTRAP_ADMIN_USERS: ${POLARIS_BOOTSTRAP_ADMIN_USERS:-}
      POLARIS_DEFAULT_CODEX_RIGHTCODE_API_KEY: ${POLARIS_DEFAULT_CODEX_RIGHTCODE_API_KEY:-}
      POLARIS_PASEO_APP_BASE_URL: ${POLARIS_PASEO_APP_BASE_URL:-}
      POLARIS_AUTHING_APP_ID: ${POLARIS_AUTHING_APP_ID:-}
      POLARIS_AUTHING_APP_SECRET: ${POLARIS_AUTHING_APP_SECRET:-}
      POLARIS_AUTHING_ISSUER: ${POLARIS_AUTHING_ISSUER:-}
      POLARIS_AUTHING_JWKS_URL: ${POLARIS_AUTHING_JWKS_URL:-}
      POLARIS_AUTHING_AUTHORIZATION_URL: ${POLARIS_AUTHING_AUTHORIZATION_URL:-}
      POLARIS_AUTHING_TOKEN_URL: ${POLARIS_AUTHING_TOKEN_URL:-}
      POLARIS_AUTHING_REDIRECT_URI: ${POLARIS_AUTHING_REDIRECT_URI:-}
      POLARIS_AUTHING_LOGOUT_URL: ${POLARIS_AUTHING_LOGOUT_URL:-}
      POLARIS_AUTHING_LOGOUT_REDIRECT_URI: ${POLARIS_AUTHING_LOGOUT_REDIRECT_URI:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "${POLARIS_SERVER_BIND_HOST:-127.0.0.1}:${POLARIS_SERVER_PORT:-8787}:8787"
    expose:
      - "8787"
    volumes:
      - ${POLARIS_DATA_ROOT}:/workspace/polaris-data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - landing-page
      - paseo-app
      - polaris-server
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      LANDING_PAGE_UPSTREAM: ${LANDING_PAGE_UPSTREAM:-127.0.0.1:${POLARIS_LANDING_PAGE_PORT:-5173}}
      POLARIS_SERVER_UPSTREAM: ${POLARIS_SERVER_UPSTREAM:-127.0.0.1:${POLARIS_SERVER_PORT:-8787}}
      PASEO_APP_UPSTREAM: ${PASEO_APP_UPSTREAM:-127.0.0.1:${PASEO_APP_PORT:-8082}}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../docker/nginx/templates:/etc/nginx/templates:ro
