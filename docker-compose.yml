services:
  paseo-app:
    build:
      context: ./apps/paseo
      dockerfile: Dockerfile
      args:
        PASEO_GIT_URL: https://github.com/cyruscyliu/paseo.git
        PASEO_GIT_REF: 3d6b4adc68dc426789974e7c0bbad9d783a34c1f
        PASEO_WEB_BASE_URL: /paseo
    restart: unless-stopped
    ports:
      - "${PASEO_APP_BIND_HOST:-127.0.0.1}:${PASEO_APP_PORT:-8082}:8082"
    expose:
      - "8082"

  polaris-webportal:
    build:
      context: .
      dockerfile: apps/polaris-web/Dockerfile
      args:
        VITE_POLARIS_API_BASE: ${VITE_POLARIS_API_BASE:-/api}
        VITE_PASEO_APP_BASE_URL: ${VITE_PASEO_APP_BASE_URL:-http://localhost/paseo}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_CLERK_SIGN_IN_URL: ${VITE_CLERK_SIGN_IN_URL:-}
        VITE_CLERK_SIGN_UP_URL: ${VITE_CLERK_SIGN_UP_URL:-}
    restart: unless-stopped
    ports:
      - "${POLARIS_WEBPORTAL_BIND_HOST:-127.0.0.1}:${POLARIS_WEBPORTAL_PORT:-8081}:80"
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - paseo-app
      - polaris-webportal
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      POLARIS_SERVER_UPSTREAM: ${POLARIS_SERVER_UPSTREAM:-127.0.0.1:8787}
      POLARIS_WEBPORTAL_UPSTREAM: ${POLARIS_WEBPORTAL_UPSTREAM:-127.0.0.1:8081}
      PASEO_APP_UPSTREAM: ${PASEO_APP_UPSTREAM:-127.0.0.1:8082}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
