name: Publish Polaris Workspace Base

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable workspace-base tag to publish
        required: true
        default: polaris-0.3.0-storage-r1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Polaris
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Paseo tool bundle
        run: bash ./scripts/build-paseo-tool-bundle.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish workspace base
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./config/docker/vault-prebuilt.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/polaris-workspace-base:${{ inputs.tag }}
          provenance: false
          sbom: false

      - name: Publish immutable reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/polaris-workspace-base
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'workspace_base_image=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'workspace_base_image=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_OUTPUT"
