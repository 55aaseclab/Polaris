name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag
        required: true
      image_prefix:
        description: GHCR image prefix, for example ghcr.io/org
        required: true
permissions:
  contents: write
  packages: write

env:
  PASEO_SOURCE_REF: v0.1.101

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=${{ inputs.image_prefix }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push control plane image
        run: |
          docker build -f apps/polaris/Dockerfile -t "${{ steps.meta.outputs.image_prefix }}/polaris-control-plane:${{ steps.meta.outputs.version }}" .
          docker push "${{ steps.meta.outputs.image_prefix }}/polaris-control-plane:${{ steps.meta.outputs.version }}"
      - name: Build and push paseo image
        run: |
          rm -rf apps/paseo/source
          git clone --depth 1 --branch "${PASEO_SOURCE_REF}" https://github.com/getpaseo/paseo.git apps/paseo/source
          bash ./scripts/build-paseo-web-artifact.sh
          docker build -f apps/paseo/Dockerfile -t "${{ steps.meta.outputs.image_prefix }}/paseo-app:${{ steps.meta.outputs.version }}" .
          docker push "${{ steps.meta.outputs.image_prefix }}/paseo-app:${{ steps.meta.outputs.version }}"

  build-release-artifacts:
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runs-on: ubuntu-latest
            platforms: linux-x64
          - id: windows
            runs-on: ubuntu-latest
            platforms: win-x64
            install_nsis: true
          - id: macos
            runs-on: macos-13
            platforms: macos-x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=${{ inputs.image_prefix }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install NSIS
        if: matrix.install_nsis
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      - name: Build release artifacts
        run: >
          node scripts/build-release.mjs
          --version "${{ steps.meta.outputs.version }}"
          --image-prefix "${{ steps.meta.outputs.image_prefix }}"
          --platforms ${{ matrix.platforms }}
      - name: Stage upload files
        shell: bash
        run: |
          mkdir -p dist/upload
          case "${{ matrix.id }}" in
            linux)
              cp "dist/release/polaris_${{ steps.meta.outputs.version }}_amd64.deb" dist/upload/
              cp dist/release/release-metadata.json dist/upload/
              ;;
            windows)
              cp "dist/release/polaris_${{ steps.meta.outputs.version }}_win_x64_setup.exe" dist/upload/
              ;;
            macos)
              cp "dist/release/polaris_${{ steps.meta.outputs.version }}_macos_x64.dmg" dist/upload/
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-release-${{ matrix.id }}
          path: dist/upload/**

  publish-release:
    needs: build-release-artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: polaris-release-*
          merge-multiple: true
          path: dist/upload
      - name: Verify release assets
        run: |
          test -f "dist/upload/polaris_${GITHUB_REF_NAME}_amd64.deb"
          test -f "dist/upload/polaris_${GITHUB_REF_NAME}_win_x64_setup.exe"
          test -f "dist/upload/polaris_${GITHUB_REF_NAME}_macos_x64.dmg"
          test -f "dist/upload/release-metadata.json"
      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/upload/*
